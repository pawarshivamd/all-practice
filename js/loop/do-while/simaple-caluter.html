<script>
    let userInput
    do {
        let num1 = Number(prompt("Enter your first number"))
        let num2 = Number(prompt("Enter your second number"))
        let operator = prompt("Enter valid operator (+,-,*,-)")

        switch (operator) {
            case '+':
                console.log(`result ${num1 + num2}`)
                break;
            case '-':
                console.log(`result ${num1 - num2}`)
                break;
            case '*':
                console.log(`result ${num1 * num2}`)
                break;
            case '/':
                num2 !== 0 ? console.log(`result ${num1 / num2}`) : console.log(`Enter valid number for / `)
                break;

            default:
                console.log(`Enter valid number`)
        }
        userInput = prompt("kya app vaspish try karo ge yes or no").toLowerCase()
        console.log(userInput)
    } while (userInput === 'yes');
</script>
